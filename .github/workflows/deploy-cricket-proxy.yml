name: Deploy JB STAR Cricket API Proxy

on:
  push:
    branches: [main]
    paths:
      - "workers/cricket-proxy/**"
      - ".github/workflows/deploy-cricket-proxy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jb-star-cricket-proxy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRICKETLIVEAPI_TOKEN: ${{ secrets.CRICKETLIVEAPI_TOKEN }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CRICKETLIVEAPI_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the three required secrets in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Deploy Worker
        working-directory: workers/cricket-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRICKETLIVEAPI_TOKEN: ${{ secrets.CRICKETLIVEAPI_TOKEN }}
        run: |
          printf '%s' "$CRICKETLIVEAPI_TOKEN" | wrangler secret put CRICKETLIVEAPI_TOKEN
          wrangler deploy
