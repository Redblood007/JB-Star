name: Deploy JB STAR Cricket API Proxy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jb-star-cricket-proxy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRICKETLIVEAPI_TOKEN: ${{ secrets.CRICKETLIVEAPI_TOKEN }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CRICKETLIVEAPI_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the three required secrets in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install Wrangler
        run: npm install --global wrangler@4.163.0

      - name: Deploy Worker
        working-directory: workers/cricket-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRICKETLIVEAPI_TOKEN: ${{ secrets.CRICKETLIVEAPI_TOKEN }}
        run: |
          printf '%s' "$CRICKETLIVEAPI_TOKEN" | wrangler secret put CRICKETLIVEAPI_TOKEN
          wrangler deploy
